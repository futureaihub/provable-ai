[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zorynex-provable-ai"
version = "0.4.0"
description = "Cryptographic proof infrastructure for AI decisions in fintech"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.136.1",
    "starlette==1.0.0",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.3",
    "PyNaCl==1.6.2",
    "reportlab==4.4.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "locust==2.43.4",
]

[project.scripts]
zorynex-server = "server.main:app"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
asyncio_mode  = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
# Exclude locust's monkey-patching warning from test output
addopts = "-q --tb=short"

# ── setuptools ────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["provable_ai*", "server*"]
exclude = ["tests*", "benchmarks*", "docs*"]