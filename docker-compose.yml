# Zorynex -- Development docker-compose (PostgreSQL)
# Usage:
#   docker-compose up           -- start postgres + app
#   docker-compose up --build   -- rebuild after code changes
#   docker-compose run zorynex alembic upgrade head  -- run migrations

version: "3.8"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       zorynex
      POSTGRES_USER:     zorynex
      POSTGRES_PASSWORD: zorynex_dev_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zorynex -d zorynex"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zorynex:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - zorynex_data:/data
      - ./provable_ai:/app/provable_ai:ro
      - ./server:/app/server:ro
    environment:
      ZORYNEX_BACKEND:    postgres
      DATABASE_URL:       postgres://zorynex:zorynex_dev_password@postgres:5432/zorynex
      ZORYNEX_WORKERS:    "2"
      ZORYNEX_API_KEYS:   "dev-admin:admin,dev-audit:auditor,dev-sys:system"
      ZORYNEX_WEBHOOK_SECRET: "dev-webhook-secret-change-in-prod"
      ZORYNEX_AUDIT_DB_PATH:          /data/zorynex_audit.db
      ZORYNEX_ANCHOR_DB_PATH:         /data/zorynex_anchors.db
      ZORYNEX_KEYREGISTRY_DB_PATH:    /data/zorynex_keyregistry.db
      ZORYNEX_DRIFT_DB_PATH:          /data/zorynex_drift.db
      ZORYNEX_ANCHOR_RFC3161:         "false"
    command: >
      sh -c "python3 -m uvicorn server.main:app
      --host 0.0.0.0 --port 8000 --workers 2 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
  zorynex_data: