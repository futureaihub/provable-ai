# Zorynex -- nginx reverse proxy config
#
# Place TLS cert at: nginx/certs/zorynex.crt
# Place TLS key  at: nginx/certs/zorynex.key
#
# Let's Encrypt (Certbot) example:
#   certbot certonly --standalone -d yourdomain.example.com
#   cp /etc/letsencrypt/live/yourdomain.example.com/fullchain.pem nginx/certs/zorynex.crt
#   cp /etc/letsencrypt/live/yourdomain.example.com/privkey.pem   nginx/certs/zorynex.key
#
# Replace yourdomain.example.com with your actual domain.

upstream zorynex_app {
    server zorynex:8000;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name yourdomain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.example.com;

    # -- TLS ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/zorynex.crt;
    ssl_certificate_key /etc/nginx/certs/zorynex.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # -- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # -- Rate limiting (outer layer, before auth middleware) -------------------
    # Tune these after benchmarking. Start conservative.
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req      zone=api burst=20 nodelay;

    # -- Proxy to app ---------------------------------------------------------
    location / {
        proxy_pass         http://zorynex_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts: PDF/export can take a few seconds
        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 5s;

        # Buffer: small responses (JSON) go inline; large (PDF) stream directly
        proxy_buffering          on;
        proxy_buffer_size        8k;
        proxy_buffers            8 64k;
        proxy_busy_buffers_size  128k;
    }

    # Health endpoint: no rate limiting, no auth required
    location = /health {
        proxy_pass http://zorynex_app;
        access_log off;
    }

    # Deny direct access to data paths that should never be exposed
    location ~ \.(db|sqlite|hex)$ {
        deny all;
    }
}